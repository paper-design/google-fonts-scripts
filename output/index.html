<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Bundle Viewer</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }

      .scroll-container {
        height: 359px;
        width: 300px;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid #ddd;
        background: white;
        border-radius: 4px;
        background: #eee;
      }

      .fonts-grid {
        display: flex;
        flex-direction: column;
      }

      .font-container {
        width: 289px;
        height: 36px;
        display: flex;
        align-items: center;
        padding-left: 10px;
      }

      .font-container:hover {
        background: #ddd;
      }

      .font-preview {
        background-repeat: no-repeat;

        /* Hints the browser to create a compositing layer and optimize rendering. Without this, hovering causes huge frame drops and scrolling is. But when it's enabled
        it uses a lot of memory. 250MB => 800MB */
        /* will-change: transform; */

        /* translateZ keeps the memory low, but when scrolling and revealing more elements, they struggle to appear, as the big image gets decoded again. */
        /* transform: translateZ(0); */

        /* Same problem with virtualization / intersection observer. As
         elements are revealed, the image gets decoded again. */
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script>
      const loadFontBundle = async () => {
        try {
          const response = await fetch('./font-bundle.json');
          const fonts = await response.json();

          const container = document.getElementById('container');
          const scrollContainer = document.createElement('div');
          scrollContainer.className = 'scroll-container';
          const fontsGrid = document.createElement('div');
          fontsGrid.className = 'fonts-grid';

          // Group fonts by chunk to get chunk dimensions
          const chunkInfo = {};
          fonts.forEach((font) => {
            if (!chunkInfo[font.ch]) {
              chunkInfo[font.ch] = {
                fonts: [],
                maxWidth: 0,
                maxHeight: 0,
              };
            }
            chunkInfo[font.ch].fonts.push(font);

            // Calculate chunk canvas dimensions based on font positions
            const rightEdge = font.x + font.w;
            const bottomEdge = font.y + font.h;
            if (rightEdge > chunkInfo[font.ch].maxWidth) {
              chunkInfo[font.ch].maxWidth = rightEdge;
            }
            if (bottomEdge > chunkInfo[font.ch].maxHeight) {
              chunkInfo[font.ch].maxHeight = bottomEdge;
            }
          });

          // Intersection Observer for toggling background-image
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                const fontContainer = entry.target;

                if (entry.isIntersecting) {
                  // Create and add font-preview div when visible
                  const fontPreview = document.createElement('div');
                  fontPreview.className = 'font-preview';

                  // Get font data from the createFontElement closure
                  const createPreview = fontContainer._createPreview;
                  if (createPreview) {
                    createPreview(fontPreview);
                  }

                  fontContainer.appendChild(fontPreview);
                } else {
                  // Remove font-preview div when not visible to save memory
                  const fontPreview = fontContainer.querySelector('.font-preview');
                  if (fontPreview) {
                    fontContainer.removeChild(fontPreview);
                  }
                }
              });
            },
            {
              root: scrollContainer,
              rootMargin: '50px',
            }
          );

          fonts.forEach((font) => {
            const fontContainer = document.createElement('div');
            fontContainer.className = 'font-container';

            // Store a function that can create the preview with the font data
            fontContainer._createPreview = (fontPreview) => {
              const standardHeight = 16;
              const aspectRatio = font.w / font.h;
              const standardWidth = Math.round(standardHeight * aspectRatio);
              const scale = standardHeight / font.h;

              // Get chunk canvas dimensions
              const chunkCanvasWidth = chunkInfo[font.ch].maxWidth;
              const chunkCanvasHeight = chunkInfo[font.ch].maxHeight;

              fontPreview.style.width = `${standardWidth}px`;
              fontPreview.style.height = `${standardHeight}px`;
              fontPreview.style.backgroundSize = `${chunkCanvasWidth * scale}px ${chunkCanvasHeight * scale}px`;
              fontPreview.style.backgroundPosition = `-${font.x * scale}px -${font.y * scale}px`;
              fontPreview.style.backgroundImage = `url('./chunks/font-bundle-${font.ch}.avif')`;
            };

            fontsGrid.appendChild(fontContainer);

            // Observe each font container for visibility changes
            observer.observe(fontContainer);
          });

          scrollContainer.appendChild(fontsGrid);
          container.innerHTML = '';
          container.appendChild(scrollContainer);
        } catch (error) {
          console.error('Error loading font bundle:', error);
        }
      };

      window.addEventListener('load', loadFontBundle);
    </script>
  </body>
</html>

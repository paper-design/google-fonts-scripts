<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Bundle Viewer</title>
    <link rel="preload" href="./font-bundle.avif" as="image" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }

      .fonts-grid {
        display: flex;
        flex-direction: column;
      }

      .font-container {
        width: 289px;
        height: 36px;
        background: #eee;
        display: flex;
        align-items: center;
        padding-left: 10px;
      }

      .font-container:hover {
        background: #ddd;
      }

      .font-preview {
        background-image: url('./font-bundle.avif');
        background-repeat: no-repeat;

        /* Hints the browser to create a compositing layer and optimize rendering. Without this, hovering causes huge frame drops and scrolling is. But when it's enabled
        it uses a lot of memory. 250MB => 800MB */
        will-change: transform;

        /* translateZ keeps the memory low, but when scrolling and revealing more elements, they struggle to appear, as the big image gets decoded again. */
        /* transform: translateZ(0); */

        /* Same problem with virtualization / intersection observer. As
         elements are revealed, the image gets decoded again. */
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script>
      const loadFontBundle = async () => {
        try {
          const response = await fetch('./font-bundle.json');
          const fonts = await response.json();

          const container = document.getElementById('container');
          const fontsGrid = document.createElement('div');
          fontsGrid.className = 'fonts-grid';

          fonts.forEach((font) => {
            const fontContainer = document.createElement('div');
            fontContainer.className = 'font-container';

            const fontPreview = document.createElement('div');
            fontPreview.className = 'font-preview';

            const standardHeight = 16;
            const aspectRatio = font.w / font.h;
            const standardWidth = Math.round(standardHeight * aspectRatio);
            const scale = standardHeight / font.h;

            fontPreview.style.width = `${standardWidth}px`;
            fontPreview.style.height = `${standardHeight}px`;
            fontPreview.style.backgroundSize = `${9226 * scale}px ${8969 * scale}px`;
            fontPreview.style.backgroundPosition = `-${font.x * scale}px -${font.y * scale}px`;

            fontContainer.appendChild(fontPreview);
            fontsGrid.appendChild(fontContainer);
          });

          container.innerHTML = '';
          container.appendChild(fontsGrid);
        } catch (error) {
          console.error('Error loading font bundle:', error);
        }
      };

      window.addEventListener('load', loadFontBundle);
    </script>
  </body>
</html>
